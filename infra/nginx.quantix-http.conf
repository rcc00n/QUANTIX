# Bootstrap only: never serves the dashboard over unauthenticated plaintext HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name quantix.raccncode.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/quantix/acme-webroot;
        default_type text/plain;
    }
    location / { return 404; }
    access_log /var/log/nginx/quantix-access.log;
    error_log /var/log/nginx/quantix-error.log warn;
}
