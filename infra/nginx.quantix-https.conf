# QUANTIX-only exact hosts; no default_server or protected application changes.
server {
    listen 80;
    listen [::]:80;
    server_name quantix.raccncode.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/quantix/acme-webroot;
        default_type text/plain;
    }
    location / { return 308 https://quantix.raccncode.com$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quantix.raccncode.com;
    server_tokens off;
    ssl_certificate /opt/quantix/certbot/config/live/quantix.raccncode.com/fullchain.pem;
    ssl_certificate_key /opt/quantix/certbot/config/live/quantix.raccncode.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:quantix_tls:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 32k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location ~ /\. { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3310;
        proxy_set_header Host quantix.raccncode.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
        proxy_buffering off;
    }
    access_log /var/log/nginx/quantix-access.log;
    error_log /var/log/nginx/quantix-error.log warn;
}
