[project]
name = "arbiq-backend"
version = "0.7.1"
description = "QUANTIX public market intelligence and paper-only foundations"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn[standard]>=0.38,<1",
  "sqlalchemy[asyncio]>=2.0.44,<2.1",
  "alembic>=1.17,<2",
  "asyncpg>=0.30,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "structlog>=25.5,<26",
  "ccxt>=4.5,<5",
  "aiohttp>=3.12,<4",
  "websockets>=15,<18",
]
[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "httpx>=0.28,<1", "ruff>=0.14,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["arbiq"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
[tool.pytest.ini_options]
testpaths = ["../tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
